server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bare /new → /new/ so it doesn't fall through to the classic app shell.
    location = /new {
        return 301 /new/;
    }

    # Redesign preview SPA — deep links (/new/about) fall back to its own shell.
    location /new/ {
        try_files $uri $uri/ /new/index.html;
    }

    # Classic SPA — also fixes /about deep-link refresh (no fallback before).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
