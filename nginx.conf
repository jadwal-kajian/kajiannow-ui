server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A kajian record's fields come from community posts, so the page must not
    # run script it was handed: a javascript: maps link ran as this site until
    # the client checked it. script-src lists our own files and the hash of the
    # one inline script (the theme setter in new/index.html); tests/csp.spec.js
    # fails when that script changes and this hash does not. Images, tiles and
    # the API are left open on purpose so the policy cannot blank the map.
    add_header Content-Security-Policy "script-src 'self' 'sha256-mIFawwYPrnFmnBVsprgeuNYi8DuMWOZPb2daRescczU='; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bare /new → /new/ so it doesn't fall through to the classic app shell.
    location = /new {
        return 301 /new/;
    }

    # Redesign preview SPA — deep links (/new/about) fall back to its own shell.
    location /new/ {
        try_files $uri $uri/ /new/index.html;
    }

    # Classic SPA — also fixes /about deep-link refresh (no fallback before).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
